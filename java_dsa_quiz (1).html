<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Java DSA Mid-Term Quiz</title>
<style>
  :root{
    --navy:#0a1f44;
    --navy-light:#132c5c;
    --navy-lighter:#1c3a72;
    --gold:#d4af37;
    --gold-light:#e8c766;
    --white:#f7f7f5;
    --grey:#9aa5b8;
    --red:#e05a5a;
    --green:#4caf7d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,var(--navy) 0%, #050d1f 100%);
    color:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  .card{
    width:100%;
    max-width:780px;
    background:var(--navy-light);
    border:1px solid var(--navy-lighter);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .header{
    padding:20px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--navy-lighter);
  }
  .header h1{
    font-size:19px;
    margin:0;
    color:var(--gold-light);
    letter-spacing:0.3px;
  }
  .header .sub{
    font-size:12px;
    color:var(--grey);
    margin-top:2px;
  }
  .counters{display:flex;gap:8px;align-items:center;}
  .pill{
    font-size:13px;
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
  }
  .pill.wrong{background:rgba(224,90,90,0.18);color:var(--red);}
  .pill.right{background:rgba(76,175,125,0.18);color:var(--green);}
  .progress-wrap{padding:14px 26px 0;}
  .progress-bar{
    height:6px;background:var(--navy-lighter);border-radius:4px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-light) 100%);
    border-radius:4px;transition:width .35s ease;
  }
  .progress-label{
    text-align:right;font-size:12px;color:var(--grey);margin-top:6px;
  }
  .body{padding:26px;}
  .qnum{color:var(--gold-light);font-weight:700;font-size:14px;margin-bottom:8px;letter-spacing:.4px;text-transform:uppercase;}
  .qtext{font-size:18px;line-height:1.5;margin-bottom:22px;color:var(--white);}
  .options{display:flex;flex-direction:column;gap:12px;}
  .option{
    background:var(--navy-lighter);
    border:1px solid transparent;
    border-radius:10px;
    padding:14px 16px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    cursor:pointer;
    font-size:15px;
    transition:all .15s ease;
  }
  .option:hover{border-color:var(--gold);}
  .option .tag{
    font-weight:700;color:var(--gold-light);min-width:18px;
  }
  .option.selected{border-color:var(--gold);background:#213f7a;}
  .option.correct{border-color:var(--green);background:rgba(76,175,125,0.18);}
  .option.incorrect{border-color:var(--red);background:rgba(224,90,90,0.18);}
  .option.disabled{cursor:default;}
  .hint-toggle{
    margin-top:20px;color:var(--grey);font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  .hint-toggle .arrow{transition:transform .2s ease;}
  .hint-toggle.open .arrow{transform:rotate(180deg);}
  .hint-text{
    margin-top:10px;font-size:13px;color:var(--grey);
    background:var(--navy);border-left:3px solid var(--gold);
    padding:10px 14px;border-radius:6px;display:none;
  }
  .hint-text.show{display:block;}
  .footer{
    padding:18px 26px 26px;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--navy-lighter);
  }
  button{
    font-family:inherit;font-size:14px;font-weight:600;
    border:none;border-radius:8px;padding:11px 22px;cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-secondary{background:var(--navy-lighter);color:var(--white);}
  .btn-primary{background:var(--gold);color:var(--navy);}
  .btn-primary:hover:not(:disabled){background:var(--gold-light);}
  .btn-ghost{background:transparent;color:var(--grey);border:1px solid var(--navy-lighter);}
  .btn-ghost:hover{color:var(--gold-light);border-color:var(--gold);}
  /* name gate */
  .gate{padding:50px 30px;text-align:center;}
  .gate h2{color:var(--gold-light);margin-bottom:6px;}
  .gate p{color:var(--grey);font-size:14px;margin-bottom:24px;}
  .gate input{
    width:100%;max-width:320px;padding:12px 14px;border-radius:8px;
    border:1px solid var(--navy-lighter);background:var(--navy);color:var(--white);
    font-size:15px;margin-bottom:16px;
  }
  .gate input:focus{outline:none;border-color:var(--gold);}
  .admin-link{
    margin-top:30px;font-size:12px;color:var(--grey);cursor:pointer;
    letter-spacing:.5px;text-decoration:underline;text-underline-offset:3px;
    display:inline-block;
  }
  .admin-link:hover{color:var(--gold-light);}
  /* results */
  .results{padding:36px 30px;text-align:center;}
  .results .score{
    font-size:52px;font-weight:800;color:var(--gold-light);margin:10px 0 4px;
  }
  .results .score-sub{color:var(--grey);font-size:14px;margin-bottom:28px;}
  .leaderboard{
    text-align:left;background:var(--navy);border-radius:10px;padding:16px 18px;margin-top:10px;
  }
  .leaderboard h3{margin:0 0 12px;color:var(--gold-light);font-size:15px;}
  .lb-row{
    display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid var(--navy-lighter);font-size:14px;
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-row.me{color:var(--gold-light);font-weight:700;}
  .lb-rank{color:var(--grey);width:26px;display:inline-block;}
  .loading{color:var(--grey);font-size:13px;text-align:center;padding:10px;}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap;}
  /* admin */
  .admin-body{padding:26px;}
  .admin-list{display:flex;flex-direction:column;gap:10px;}
  .admin-row{
    background:var(--navy);border:1px solid var(--navy-lighter);border-radius:10px;
    padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;transition:border-color .15s ease;
  }
  .admin-row:hover{border-color:var(--gold);}
  .admin-row .name{font-weight:600;}
  .admin-row .meta{font-size:12px;color:var(--grey);margin-top:2px;}
  .admin-row .score-badge{
    font-weight:700;color:var(--gold-light);font-size:16px;
  }
  .admin-toolbar{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
    flex-wrap:wrap;gap:10px;
  }
  .admin-toolbar .title{font-size:15px;color:var(--gold-light);font-weight:700;}
  .search-box{
    padding:8px 12px;border-radius:8px;border:1px solid var(--navy-lighter);
    background:var(--navy);color:var(--white);font-size:13px;min-width:180px;
  }
  .search-box:focus{outline:none;border-color:var(--gold);}
  .sheet-q{
    background:var(--navy);border-radius:10px;padding:14px 16px;margin-bottom:10px;
    border-left:3px solid var(--navy-lighter);
  }
  .sheet-q.correct{border-left-color:var(--green);}
  .sheet-q.incorrect{border-left-color:var(--red);}
  .sheet-q .qline{font-size:14px;margin-bottom:8px;color:var(--white);}
  .sheet-q .answer-line{font-size:13px;color:var(--grey);margin-top:4px;}
  .sheet-q .answer-line.wrong{color:var(--red);}
  .sheet-q .answer-line.right{color:var(--green);}
  .back-link{
    font-size:13px;color:var(--grey);cursor:pointer;margin-bottom:16px;display:inline-block;
  }
  .back-link:hover{color:var(--gold-light);}
</style>
</head>
<body>

<div class="card" id="app"></div>

<script>
/* ===== CHANGE THIS TO YOUR OWN ADMIN PASSWORD ===== */
const ADMIN_PASSWORD = "gladsa2026";
/* ==================================================== */

const QUIZ = {
  title: "Java DSA Mid-Term Quiz",
  questions: [
    {
      q: "In Java, what happens when you repeatedly concatenate characters to an existing standard String object within a loop?",
      options: [
        "A new String object is allocated each time in memory.",
        "A character array is temporarily generated in-place.",
        "The original String object is modified in-place.",
        "The garbage collector pauses the execution thread."
      ],
      correct: 0,
      hint: "Think about String immutability — can a String object's internal character data ever change after creation?"
    },
    {
      q: "Which class would you prefer over String for building a large string inside a loop with thousands of concatenations, and why?",
      options: [
        "String, because it caches results automatically.",
        "StringBuilder, because it uses a mutable, resizable character buffer.",
        "Character, because it stores single characters more efficiently.",
        "Integer, because concatenation is a numeric operation."
      ],
      correct: 1,
      hint: "Which class avoids creating a brand-new object on every single append?"
    },
    {
      q: "What is the main difference between StringBuilder and StringBuffer?",
      options: [
        "StringBuilder is immutable, StringBuffer is mutable.",
        "StringBuffer is synchronized (thread-safe), StringBuilder is not.",
        "StringBuilder can only hold numbers.",
        "There is no difference; they are aliases in Java."
      ],
      correct: 1,
      hint: "One of them was designed with multi-threaded environments in mind — that comes with a performance cost."
    },
    {
      q: "In the Two Pointer technique with 'start' and 'end' pointers on a sorted array, what is the general condition to keep the loop running?",
      options: [
        "start > end",
        "start == end",
        "start < end (or <=, depending on use case)",
        "end < 0"
      ],
      correct: 2,
      hint: "The two pointers move toward each other from opposite ends — when do they stop being valid?"
    },
    {
      q: "What is the core idea behind the Sliding Window technique for array/string problems?",
      options: [
        "Sorting the array before every comparison.",
        "Maintaining a contiguous range of elements and adjusting its boundaries instead of recomputing from scratch.",
        "Using recursion to check every possible subarray.",
        "Reversing the array first, then scanning left to right."
      ],
      correct: 1,
      hint: "Think of a 'window' of fixed or variable size that slides across the array, reusing previous work."
    },
    {
      q: "Which data structure is most commonly used for Frequency Counting problems (e.g., LeetCode 242: Valid Anagram)?",
      options: [
        "Stack",
        "HashMap (or an int[] array for fixed character sets like a–z)",
        "LinkedList",
        "Two-dimensional array"
      ],
      correct: 1,
      hint: "You need fast O(1) lookups to count how many times each character/element appears."
    },
    {
      q: "Two strings are anagrams of each other if:",
      options: [
        "They have the same length only.",
        "They contain the exact same characters with the exact same frequencies, in any order.",
        "They start with the same letter.",
        "They are sorted identically only when reversed."
      ],
      correct: 1,
      hint: "Think about what 'listen' and 'silent' have in common when you count each letter."
    },
    {
      q: "Given a Prefix Sum array built from arr[], how do you compute the sum of elements from index i to j (i <= j) in O(1) time?",
      options: [
        "prefix[j] - prefix[i]",
        "prefix[j] + prefix[i]",
        "prefix[j] - prefix[i-1] (treating prefix[-1] as 0)",
        "You must always recompute the sum by looping from i to j."
      ],
      correct: 2,
      hint: "The prefix array stores cumulative sums — subtract everything before index i from everything up to index j."
    },
    {
      q: "What is a strict requirement for Binary Search to work correctly on an array?",
      options: [
        "The array must contain only positive integers.",
        "The array must be sorted.",
        "The array must have an even number of elements.",
        "The array must not contain duplicates."
      ],
      correct: 1,
      hint: "Binary search eliminates half the search space each step — that only works if order is guaranteed."
    },
    {
      q: "What is the worst-case time complexity of Binary Search on an array of n elements, and how does it compare to Linear Search?",
      options: [
        "O(n) — same as Linear Search.",
        "O(n^2) — slower than Linear Search.",
        "O(log n) — significantly faster than Linear Search's O(n) for large n.",
        "O(1) — constant time regardless of array size."
      ],
      correct: 2,
      hint: "Each comparison in binary search cuts the remaining elements roughly in half."
    }
  ]
};

const state = {
  screen: 'gate',      // gate | quiz | results | adminLogin | admin | adminDetail
  name: '',
  current: 0,
  selected: null,
  answered: [],
  hintOpen: false,
  correctCount: 0,
  wrongCount: 0,
  saved: false,
  adminError: '',
  adminEntries: null,      // cached list of all attempts
  adminDetailEntry: null,  // entry being viewed in detail
  adminSearch: ''
};

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'gate') app.innerHTML = renderGate();
  else if(state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if(state.screen === 'results') app.innerHTML = renderResults();
  else if(state.screen === 'adminLogin') app.innerHTML = renderAdminLogin();
  else if(state.screen === 'admin') app.innerHTML = renderAdminList();
  else if(state.screen === 'adminDetail') app.innerHTML = renderAdminDetail();
  attachHandlers();
}

function renderGate(){
  return `
    <div class="gate">
      <h2>${QUIZ.title}</h2>
      <p>Enter your name to begin — your score will be added to the class leaderboard.</p>
      <input type="text" id="nameInput" placeholder="Your name" maxlength="40" />
      <br/>
      <button class="btn-primary" id="startBtn">Start Quiz</button>
      <div class="admin-link" id="adminLink">Instructor Admin Panel</div>
    </div>
  `;
}

function renderQuiz(){
  const idx = state.current;
  const total = QUIZ.questions.length;
  const q = QUIZ.questions[idx];
  const ans = state.answered[idx];
  const pct = Math.round((idx / total) * 100);

  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option';
    if(ans !== null && ans !== undefined){
      cls += ' disabled';
      if(i === q.correct) cls += ' correct';
      else if(i === ans.selectedIdx) cls += ' incorrect';
    } else if(state.selected === i){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65 + i);
    return `<div class="${cls}" data-idx="${i}">
      <span class="tag">${letter}.</span><span>${opt}</span>
    </div>`;
  }).join('');

  return `
    <div class="header">
      <div>
        <h1>${QUIZ.title}</h1>
        <div class="sub">${escapeHtml(state.name)}</div>
      </div>
      <div class="counters">
        <span class="pill wrong">✕ ${state.wrongCount}</span>
        <span class="pill right">✓ ${state.correctCount}</span>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${idx+1}/${total}</div>
    </div>
    <div class="body">
      <div class="qnum">Question ${idx+1}</div>
      <div class="qtext">${q.q}</div>
      <div class="options">${optionsHtml}</div>
      <div class="hint-toggle ${state.hintOpen ? 'open':''}" id="hintToggle">
        Hint <span class="arrow">▾</span>
      </div>
      <div class="hint-text ${state.hintOpen ? 'show':''}">${q.hint}</div>
    </div>
    <div class="footer">
      <button class="btn-secondary" id="backBtn" ${idx===0 ? 'disabled':''}>Back</button>
      <button class="btn-primary" id="nextBtn" ${(ans===null||ans===undefined) && state.selected===null ? 'disabled':''}>
        ${idx === total-1 ? 'Finish' : 'Next'}
      </button>
    </div>
  `;
}

function renderResults(){
  const total = QUIZ.questions.length;
  const pctScore = Math.round((state.correctCount/total)*100);
  return `
    <div class="results">
      <div class="sub" style="color:var(--grey);font-size:13px;">${escapeHtml(state.name)}'s Result</div>
      <div class="score">${state.correctCount}/${total}</div>
      <div class="score-sub">${pctScore}% correct</div>
      <div class="leaderboard" id="lbContainer">
        <h3>Class Leaderboard</h3>
        <div class="loading">Loading leaderboard…</div>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="retryBtn">Retake Quiz</button>
      </div>
    </div>
  `;
}

function renderAdminLogin(){
  return `
    <div class="gate">
      <h2>Instructor Admin Panel</h2>
      <p>Enter the admin password to view the leaderboard and individual answer sheets.</p>
      <input type="password" id="pwInput" placeholder="Password" />
      <br/>
      ${state.adminError ? `<div style="color:var(--red);font-size:12px;margin-bottom:12px;">${state.adminError}</div>` : ''}
      <button class="btn-primary" id="pwSubmit">Enter</button>
      <br/><br/>
      <div class="admin-link" id="backToQuiz">← Back to quiz</div>
    </div>
  `;
}

function renderAdminList(){
  const entries = state.adminEntries || [];
  const total = QUIZ.questions.length;
  const q = state.adminSearch.toLowerCase();
  const filtered = entries.filter(e => (e.name||'').toLowerCase().includes(q));

  const rows = filtered.map((e, i) => `
    <div class="admin-row" data-idx="${entries.indexOf(e)}">
      <div>
        <div class="name">${escapeHtml(e.name)}</div>
        <div class="meta">${new Date(e.ts).toLocaleString()}</div>
      </div>
      <div class="score-badge">${e.score}/${total}</div>
    </div>
  `).join('');

  return `
    <div class="header">
      <div>
        <h1>Admin — All Attempts</h1>
        <div class="sub">${entries.length} attempt${entries.length===1?'':'s'} recorded</div>
      </div>
    </div>
    <div class="admin-body">
      <div class="admin-toolbar">
        <div class="title">Click a student to view their full answer sheet</div>
        <input class="search-box" id="searchBox" placeholder="Search name…" value="${escapeHtml(state.adminSearch)}" />
      </div>
      <div class="admin-list">
        ${filtered.length ? rows : '<div class="loading">No attempts match.</div>'}
      </div>
      <br/>
      <div class="actions">
        <button class="btn-ghost" id="refreshBtn">Refresh Data</button>
        <button class="btn-secondary" id="exitAdminBtn">Exit Admin Panel</button>
      </div>
    </div>
  `;
}

function renderAdminDetail(){
  const e = state.adminDetailEntry;
  const total = QUIZ.questions.length;
  const rows = QUIZ.questions.map((q, i) => {
    const a = e.answers ? e.answers[i] : null;
    const correctLetter = String.fromCharCode(65 + q.correct);
    if(!a){
      return `<div class="sheet-q">
        <div class="qline"><strong>Q${i+1}.</strong> ${q.q}</div>
        <div class="answer-line">Not answered.</div>
      </div>`;
    }
    const selLetter = String.fromCharCode(65 + a.selectedIdx);
    const cls = a.correct ? 'correct' : 'incorrect';
    return `<div class="sheet-q ${cls}">
      <div class="qline"><strong>Q${i+1}.</strong> ${q.q}</div>
      <div class="answer-line ${a.correct ? 'right':'wrong'}">
        Answered: ${selLetter}. ${q.options[a.selectedIdx]} ${a.correct ? '✓' : '✕'}
      </div>
      ${!a.correct ? `<div class="answer-line right">Correct: ${correctLetter}. ${q.options[q.correct]}</div>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="header">
      <div>
        <h1>${escapeHtml(e.name)}'s Answer Sheet</h1>
        <div class="sub">${new Date(e.ts).toLocaleString()} — Score: ${e.score}/${total}</div>
      </div>
    </div>
    <div class="admin-body">
      <div class="back-link" id="backToListBtn">← Back to all attempts</div>
      ${rows}
      <div class="actions">
        <button class="btn-secondary" id="exitAdminBtn2">Exit Admin Panel</button>
      </div>
    </div>
  `;
}

function attachHandlers(){
  if(state.screen === 'gate'){
    document.getElementById('startBtn').onclick = () => {
      const val = document.getElementById('nameInput').value.trim();
      if(!val){ document.getElementById('nameInput').focus(); return; }
      state.name = val;
      state.screen = 'quiz';
      state.answered = new Array(QUIZ.questions.length).fill(null);
      render();
    };
    document.getElementById('nameInput').addEventListener('keydown', e=>{
      if(e.key === 'Enter') document.getElementById('startBtn').click();
    });
    document.getElementById('nameInput').focus();
    document.getElementById('adminLink').onclick = () => {
      state.screen = 'adminLogin';
      state.adminError = '';
      render();
    };
  }
  else if(state.screen === 'quiz'){
    const idx = state.current;
    const ans = state.answered[idx];
    if(ans === null || ans === undefined){
      document.querySelectorAll('.option').forEach(el=>{
        el.onclick = () => {
          const i = parseInt(el.dataset.idx);
          state.selected = i;
          const q = QUIZ.questions[idx];
          const correct = i === q.correct;
          state.answered[idx] = {selectedIdx:i, correct};
          if(correct) state.correctCount++; else state.wrongCount++;
          render();
        };
      });
    }
    document.getElementById('hintToggle').onclick = () => {
      state.hintOpen = !state.hintOpen;
      render();
    };
    document.getElementById('backBtn').onclick = () => {
      if(state.current > 0){
        state.current--;
        state.selected = null;
        state.hintOpen = false;
        render();
      }
    };
    document.getElementById('nextBtn').onclick = () => {
      if(state.current < QUIZ.questions.length - 1){
        state.current++;
        state.selected = null;
        state.hintOpen = false;
        render();
      } else {
        state.screen = 'results';
        render();
      }
    };
  }
  else if(state.screen === 'results'){
    document.getElementById('retryBtn').onclick = () => {
      state.screen = 'gate';
      state.current = 0;
      state.selected = null;
      state.answered = [];
      state.correctCount = 0;
      state.wrongCount = 0;
      state.hintOpen = false;
      state.saved = false;
      render();
    };
    saveScoreAndLoadLeaderboard();
  }
  else if(state.screen === 'adminLogin'){
    document.getElementById('pwSubmit').onclick = () => {
      const val = document.getElementById('pwInput').value;
      if(val === ADMIN_PASSWORD){
        state.screen = 'admin';
        state.adminError = '';
        loadAdminData();
      } else {
        state.adminError = 'Incorrect password.';
        render();
      }
    };
    document.getElementById('pwInput').addEventListener('keydown', e=>{
      if(e.key === 'Enter') document.getElementById('pwSubmit').click();
    });
    document.getElementById('pwInput').focus();
    document.getElementById('backToQuiz').onclick = () => {
      state.screen = 'gate';
      render();
    };
  }
  else if(state.screen === 'admin'){
    document.querySelectorAll('.admin-row').forEach(el=>{
      el.onclick = () => {
        const i = parseInt(el.dataset.idx);
        state.adminDetailEntry = state.adminEntries[i];
        state.screen = 'adminDetail';
        render();
      };
    });
    document.getElementById('searchBox').oninput = (e) => {
      state.adminSearch = e.target.value;
      render();
    };
    document.getElementById('refreshBtn').onclick = () => loadAdminData();
    document.getElementById('exitAdminBtn').onclick = () => {
      state.screen = 'gate';
      render();
    };
  }
  else if(state.screen === 'adminDetail'){
    document.getElementById('backToListBtn').onclick = () => {
      state.screen = 'admin';
      render();
    };
    document.getElementById('exitAdminBtn2').onclick = () => {
      state.screen = 'gate';
      render();
    };
  }
}

async function saveScoreAndLoadLeaderboard(){
  const lbContainer = document.getElementById('lbContainer');
  const total = QUIZ.questions.length;
  try{
    if(!state.saved){
      const key = 'score:' + state.name.toLowerCase().replace(/\s+/g,'_') + ':' + Date.now();
      await window.storage.set(key, JSON.stringify({
        name: state.name,
        score: state.correctCount,
        total: total,
        ts: Date.now(),
        answers: state.answered
      }), true);
      state.saved = true;
    }

    const entries = await fetchAllAttempts();

    const bestByName = {};
    for(const e of entries){
      const key = (e.name || 'Unknown').toLowerCase();
      if(!bestByName[key] || e.score > bestByName[key].score){
        bestByName[key] = e;
      }
    }
    const ranked = Object.values(bestByName).sort((a,b)=> b.score - a.score || a.ts - b.ts);

    if(ranked.length === 0){
      lbContainer.innerHTML = `<h3>Class Leaderboard</h3><div class="loading">No scores yet — you're the first!</div>`;
      return;
    }

    const rows = ranked.map((e,i)=>{
      const isMe = e.name === state.name && e.score === state.correctCount;
      return `<div class="lb-row ${isMe ? 'me':''}">
        <span><span class="lb-rank">${i+1}.</span>${escapeHtml(e.name)}</span>
        <span>${e.score}/${e.total}</span>
      </div>`;
    }).join('');

    lbContainer.innerHTML = `<h3>Class Leaderboard</h3>${rows}`;
  }catch(err){
    lbContainer.innerHTML = `<h3>Class Leaderboard</h3><div class="loading">Couldn't load leaderboard right now.</div>`;
    console.error('Leaderboard error:', err);
  }
}

async function fetchAllAttempts(){
  const listResult = await window.storage.list('score:', true);
  const keys = (listResult && listResult.keys) ? listResult.keys : [];
  const entries = [];
  for(const k of keys){
    try{
      const r = await window.storage.get(k, true);
      if(r && r.value){
        entries.push(JSON.parse(r.value));
      }
    }catch(e){ /* skip unreadable entry */ }
  }
  return entries;
}

async function loadAdminData(){
  state.screen = 'admin';
  render();
  const listEl = document.querySelector('.admin-list');
  if(listEl) listEl.innerHTML = '<div class="loading">Loading attempts…</div>';
  try{
    const entries = await fetchAllAttempts();
    entries.sort((a,b)=> b.ts - a.ts);
    state.adminEntries = entries;
  }catch(err){
    state.adminEntries = [];
    console.error('Admin load error:', err);
  }
  render();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
